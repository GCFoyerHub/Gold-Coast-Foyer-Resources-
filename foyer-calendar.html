<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foyer Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:   #1D4ED8;
    --pink:   #EC4899;
    --yellow: #FACC15;
    --purple: #7C3AED;
    --teal:   #0D9488;
    --dark:   #0F1117;
    --light:  #F4F4F6;
  }

  body {
    background: var(--dark);
    color: var(--light);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  /* Header */
  header {
    margin-bottom: 2rem;
    animation: fadeUp 0.5s ease both;
  }

  header h1 {
    font-size: clamp(3rem, 10vw, 5.5rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #fff;
  }

  header h1 .accent {
    display: block;
    background: linear-gradient(90deg, var(--pink), var(--yellow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(244,244,246,0.85);
    margin-top: 0.5rem;
    letter-spacing: 0.02em;
  }

  /* Colour bar accent */
  .colour-bar {
    display: flex;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    margin: 1.5rem 0;
    gap: 3px;
  }

  .colour-bar span {
    flex: 1;
    border-radius: 2px;
  }

  /* Calendar embed container */
  .cal-wrap {
    background: #1a1d2b;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.5s ease 0.15s both;
  }

  .cal-wrap iframe {
    display: block;
    width: 100%;
    height: 680px;
    border: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .cal-wrap iframe { height: 500px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <h1>Foyer<span class="accent">Events</span></h1>
    <p class="subtitle">What's on this month</p>
  </header>

  <div class="colour-bar">
    <span style="background:var(--blue)"></span>
    <span style="background:var(--pink)"></span>
    <span style="background:var(--yellow)"></span>
    <span style="background:var(--purple)"></span>
    <span style="background:var(--teal)"></span>
  </div>

  <div class="cal-wrap">
    <iframe
      src="https://calendar.google.com/calendar/embed?src=b79b4d6421c64feac148900f260cb493ca638805b87e121bf43603b791867d61%40group.calendar.google.com&ctz=Australia%2FBrisbane&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&mode=MONTH"
      frameborder="0"
      scrolling="no"
      allowtransparency="true">
    </iframe>
  </div>

</div>
</body>
</html>
